
name: crud_mobile_grafica_back
description: Backend do projeto Mobile Gráfica utilizando Dart Frog e PostgreSQL.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ^3.11.0

dependencies:
  # Framework para criação da API
  dart_frog: ^1.1.0

  # Banco de dados PostgreSQL
  postgres: ^3.5.20

  # Gerador de identificadores UUID
  uuid: ^4.6.0

  # Variáveis de ambiente
  dotenv: ^4.2.0

  # Criptografia de senhas
  bcrypt: ^1.2.0

dev_dependencies:
  # Regras de análise do Dart Frog
  dart_frog_lint: ^0.1.0

  # Simulação de dependências nos testes
  mocktail: ^1.0.0

  # Testes automatizados
  test: ^1.0.0
